<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

    <header style="background-color: #333; color: #fff; padding: 1rem 0; text-align: center;">
        <h1>Patient Management</h1>
    </header>

    <nav style="background-color: #444; padding: 1rem;">
        <ul style="list-style: none; margin: 0; padding: 0; text-align: center;">
            <li style="display: inline; margin-right: 20px;"><a href="index.html" style="color: #fff; text-decoration: none;">Home</a></li>
            <li style="display: inline; margin-right: 20px;"><a href="patients.html" style="color: #fff; text-decoration: none;">Patients</a></li>
            <li style="display: inline; margin-right: 20px;"><a href="doctors.html" style="color: #fff; text-decoration: none;">Doctors</a></li>
            <li style="display: inline; margin-right: 20px;"><a href="appointments.html" style="color: #fff; text-decoration: none;">Appointments</a></li>
            <li style="display: inline;"><a href="services.html" style="color: #fff; text-decoration: none;">Services</a></li>
        </ul>
    </nav>

    <main style="padding: 20px;">
        <section id="add-patient" style="background-color: #fff; padding: 20px; margin-bottom: 20px; border-radius: 5px;">
            <h2 style="color: #333;">Add New Patient</h2>
            <form id="add-patient-form">
                <label for="name" style="display: block; margin-bottom: 5px;">Name:</label>
                <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd;">

                <label for="age" style="display: block; margin-bottom: 5px;">Age:</label>
                <input type="number" id="age" name="age" required style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd;">

                <label for="gender" style="display: block; margin-bottom: 5px;">Gender:</label>
                <select id="gender" name="gender" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd;">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <button type="submit" style="background-color: #333; color: #fff; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer;">Add Patient</button>
            </form>
        </section>

        <section id="patient-list" style="background-color: #fff; padding: 20px; border-radius: 5px;">
            <h2 style="color: #333;">Patient List</h2>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background-color: #f2f2f2;">
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Name</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Age</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Gender</th>
                    </tr>
                </thead>
                <tbody id="patient-table-body">
                    <!-- Patient data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <footer style="background-color: #333; color: #fff; text-align: center; padding: 1rem 0; position: fixed; bottom: 0; width: 100%;">
        <p>&copy; 2025 Hospital Management System. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('add-patient-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;

            const tableBody = document.getElementById('patient-table-body');
            const newRow = tableBody.insertRow();

            const nameCell = newRow.insertCell();
            nameCell.textContent = name;
            nameCell.style.border = '1px solid #ddd';
            nameCell.style.padding = '10px';


            const ageCell = newRow.insertCell();
            ageCell.textContent = age;
            ageCell.style.border = '1px solid #ddd';
            ageCell.style.padding = '10px';

            const genderCell = newRow.insertCell();
            genderCell.textContent = gender;
            genderCell.style.border = '1px solid #ddd';
            genderCell.style.padding = '10px';

            document.getElementById('add-patient-form').reset();
        });
    </script>
</body>
</html>
