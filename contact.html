<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Hospital Management System</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

    <header style="background-color: #333; color: #fff; padding: 10px 0; text-align: center;">
        <h1>Contact Us</h1>
    </header>

    <nav style="background-color: #444; padding: 10px 0; text-align: center;">
        <a href="index.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Home</a>
        <a href="about.html" style="color: #fff; text-decoration: none; padding: 0 15px;">About Us</a>
        <a href="services.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Services</a>
        <a href="doctors.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Doctors</a>
        <a href="appointments.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Appointments</a>
        <a href="blog.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Blog</a>
        <a href="contact.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Contact</a>
        <a href="departments.html" style="color: #fff; text-decoration: none; padding: 0 15px;">Departments</a>
    </nav>

    <main style="padding: 20px; text-align: center;">
        <h2>Get in Touch</h2>
        <form id="contactForm" style="display: inline-block; text-align: left;">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" required style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea><br>
            <input type="submit" value="Send Message" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer;">
        </form>
    </main>

    <footer style="background-color: #333; color: #fff; text-align: center; padding: 10px 0; position: fixed; bottom: 0; width: 100%;">
        <p>&copy; 2024 Hospital Management System. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Message sent successfully!');
        });
    </script>

</body>
</html>
