<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Evergreen General Hospital</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center;">
        <h2 style="color: #4682b4;">Hospital Login</h2>
        <form onsubmit="return handleLogin()">
            <div style="margin-bottom: 15px;">
                <label for="username" style="display: block; margin-bottom: 5px;">Username</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <button type="submit" style="background-color: #4682b4; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Login</button>
        </form>
    </div>

    <script>
        function handleLogin() {
            const username = document.getElementById('username').value;
            // Simple validation for demonstration
            if (username) {
                alert('Login successful! Redirecting to the dashboard.');
                window.location.href = 'dashboard.html';
            } else {
                alert('Please enter a username.');
            }
            return false; // Prevent form submission
        }
    </script>

</body>
</html>
