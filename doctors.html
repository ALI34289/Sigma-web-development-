    <main class="container py-5">

                    <div class="mb-3">

                    <div class="mb-3">
                        <label for="specialty" class="form-label">Specialty</label>

                    <div class="mb-3">
                        <label for="education" class="form-label">Education</label>

                    <div class="mb-3">

                    <div class="mb-3">
                        <label for="photo" class="form-label">Photo</label>

    <style>

    </style>
                            <!-- Doctor data will be inserted here by JavaScript -->
                        </tbody>

    <style>

            }
            td {

                border-bottom: 1px solid #eee;
                position: relative;
                padding-left: 50%;

            td:before {
                position: absolute;
                top: 6px;
                left: 6px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
            }
            td:nth-of-type(1):before { content: "Name"; }
            td:nth-of-type(2):before { content: "Specialty"; }

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('search-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const searchQuery = document.getElementById('search-input-header').value;
            // Implement search functionality for doctors here
        });

        let doctors = [];

        function renderDoctors() {
            const tableBody = document.getElementById('doctor-table-body');
            tableBody.innerHTML = '';
            doctors.forEach(doctor => {
                const card = document.createElement('div');
                card.className = 'doctor-card';
                let photoHtml = '';
                if (doctor.photo) {
                    photoHtml = `<img src="${doctor.photo}" alt="Photo of ${doctor.name}" class="mb-3">`;
                }
                card.innerHTML = `
                    ${photoHtml}
                    <h3>${doctor.name}</h3>
                    <p><strong>Specialty:</strong> ${doctor.specialty}</p>
                    <p><strong>Education:</strong> ${doctor.education}</p>
                    <p><strong>Affiliations:</strong> ${doctor.affiliations}</p>
                `;
                tableBody.appendChild(card);
            });
        }

        document.getElementById('add-doctor-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const specialty = document.getElementById('specialty').value;
            const education = document.getElementById('education').value;
            const affiliations = document.getElementById('affiliations').value;
            const photoInput = document.getElementById('photo');
            const newDoctor = { name, specialty, education, affiliations, photo: '' };

            if (photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    newDoctor.photo = e.target.result;
                    doctors.push(newDoctor);
                    renderDoctors();
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                doctors.push(newDoctor);
                renderDoctors();
            }

            document.getElementById('add-doctor-form').reset();
        });
    </script>
