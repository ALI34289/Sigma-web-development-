<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduling</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

    <header style="background-color: #333; color: #fff; padding: 1rem 0; text-align: center;">
        <h1>Appointment Scheduling</h1>
    </header>

    <nav style="background-color: #444; padding: 1rem;">
        <ul style="list-style: none; margin: 0; padding: 0; text-align: center;">
            <li style="display: inline; margin-right: 20px;"><a href="index.html" style="color: #fff; text-decoration: none;">Home</a></li>
            <li style="display: inline; margin-right: 20px;"><a href="patients.html" style="color: #fff; text-decoration: none;">Patients</a></li>
            <li style="display: inline; margin-right: 20px;"><a href="doctors.html" style="color: #fff; text-decoration: none;">Doctors</a></li>
            <li style="display: inline; margin-right: 20px;"><a href="appointments.html" style="color: #fff; text-decoration: none;">Appointments</a></li>
            <li style="display: inline;"><a href="services.html" style="color: #fff; text-decoration: none;">Services</a></li>
        </ul>
    </nav>

    <main style="padding: 20px;">
        <section id="schedule-appointment" style="background-color: #fff; padding: 20px; margin-bottom: 20px; border-radius: 5px;">
            <h2 style="color: #333;">Schedule New Appointment</h2>
            <form id="schedule-appointment-form">
                <label for="patient" style="display: block; margin-bottom: 5px;">Patient:</label>
                <input type="text" id="patient" name="patient" required style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd;">

                <label for="doctor" style="display: block; margin-bottom: 5px;">Doctor:</label>
                <input type="text" id="doctor" name="doctor" required style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd;">

                <label for="date" style="display: block; margin-bottom: 5px;">Date:</label>
                <input type="date" id="date" name="date" required style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 3px; border: 1px solid #ddd;">

                <button type="submit" style="background-color: #333; color: #fff; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer;">Schedule Appointment</button>
            </form>
        </section>

        <section id="appointment-list" style="background-color: #fff; padding: 20px; border-radius: 5px;">
            <h2 style="color: #333;">Appointment List</h2>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background-color: #f2f2f2;">
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Patient</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Doctor</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Date</th>
                    </tr>
                </thead>
                <tbody id="appointment-table-body">
                    <!-- Appointment data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <footer style="background-color: #333; color: #fff; text-align: center; padding: 1rem 0; position: fixed; bottom: 0; width: 100%;">
        <p>&copy; 2025 Hospital Management System. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('schedule-appointment-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const patient = document.getElementById('patient').value;
            const doctor = document.getElementById('doctor').value;
            const date = document.getElementById('date').value;

            const tableBody = document.getElementById('appointment-table-body');
            const newRow = tableBody.insertRow();

            const patientCell = newRow.insertCell();
            patientCell.textContent = patient;
            patientCell.style.border = '1px solid #ddd';
            patientCell.style.padding = '10px';

            const doctorCell = newRow.insertCell();
            doctorCell.textContent = doctor;
            doctorCell.style.border = '1px solid #ddd';
            doctorCell.style.padding = '10px';

            const dateCell = newRow.insertCell();
            dateCell.textContent = date;
            dateCell.style.border = '1px solid #ddd';
            dateCell.style.padding = '10px';

            document.getElementById('schedule-appointment-form').reset();
        });
    </script>
</body>
</html>
