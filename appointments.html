<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Evergreen General Hospital</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f8ff;">

    <header style="background-color: #4682b4; color: white; padding: 1rem; text-align: center;">
        <h1>Evergreen General Hospital</h1>
        <p>Your Health, Our Priority</p>
    </header>

    <nav style="background-color: #5f9ea0; padding: 1rem; text-align: center;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Home</a>
        <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px;">About Us</a>
        <a href="departments.html" style="color: white; text-decoration: none; margin: 0 15px;">Departments</a>
        <a href="doctors.html" style="color: white; text-decoration: none; margin: 0 15px;">Doctors</a>
        <a href="appointments.html" style="color: white; text-decoration: none; margin: 0 15px;">Appointments</a>
        <a href="contact.html" style="color: white; text-decoration: none; margin: 0 15px;">Contact Us</a>
        <a href="dashboard.html" style="color: white; text-decoration: none; margin: 0 15px;">Dashboard</a>
    </nav>

    <main style="padding: 2rem;">
        <section id="appointment-form" style="padding: 40px 20px; max-width: 600px; margin: auto; background-color: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <h2 style="font-size: 2rem; color: #4682b4; text-align: center;">Book an Appointment</h2>
            <form onsubmit="return validateForm()">
                <div style="margin-bottom: 15px;">
                    <label for="name" style="display: block; margin-bottom: 5px;">Full Name</label>
                    <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="phone" style="display: block; margin-bottom: 5px;">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="date" style="display: block; margin-bottom: 5px;">Preferred Date</label>
                    <input type="date" id="date" name="date" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="department" style="display: block; margin-bottom: 5px;">Department</label>
                    <select id="department" name="department" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                        <option value="">Select a Department</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="neurology">Neurology</option>
                        <option value="pediatrics">Pediatrics</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="message" style="display: block; margin-bottom: 5px;">Reason for Visit</label>
                    <textarea id="message" name="message" rows="4" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
                </div>
                <button type="submit" style="background-color: #4682b4; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Submit Request</button>
            </form>
        </section>
    </main>

    <footer style="background-color: #4682b4; color: white; text-align: center; padding: 1rem; position: relative; bottom: 0; width: 100%;">
        <p>&copy; 2024 Evergreen General Hospital. All rights reserved.</p>
        <p>
            <a href="#" style="color: white; text-decoration: none; margin: 0 10px;">Facebook</a> |
            <a href="#" style="color: white; text-decoration: none; margin: 0 10px;">Twitter</a> |
            <a href="#" style="color: white; text-decoration: none; margin: 0 10px;">Instagram</a>
        </p>
    </footer>

    <script>
        function validateForm() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value;
            const department = document.getElementById('department').value;
            if (name === "" || email === "" || phone === "" || date === "" || department === "") {
                alert("Please fill out all required fields.");
                return false;
            }
            alert("Appointment request submitted successfully!");
            return true;
        }
    </script>

</body>
</html>
