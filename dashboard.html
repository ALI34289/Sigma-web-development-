<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Evergreen General Hospital</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f8ff;">

    <header style="background-color: #4682b4; color: white; padding: 1rem; text-align: center;">
        <h1>Evergreen General Hospital</h1>
        <p>Your Health, Our Priority</p>
    </header>

    <nav style="background-color: #5f9ea0; padding: 1rem; text-align: center;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Home</a>
        <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px;">About Us</a>
        <a href="departments.html" style="color: white; text-decoration: none; margin: 0 15px;">Departments</a>
        <a href="doctors.html" style="color: white; text-decoration: none; margin: 0 15px;">Doctors</a>
        <a href="appointments.html" style="color: white; text-decoration: none; margin: 0 15px;">Appointments</a>
        <a href="contact.html" style="color: white; text-decoration: none; margin: 0 15px;">Contact Us</a>
        <a href="dashboard.html" style="color: white; text-decoration: none; margin: 0 15px;">Dashboard</a>
        <a href="#" onclick="logout()" style="color: white; text-decoration: none; margin: 0 15px;">Logout</a>
    </nav>

    <main style="padding: 2rem;">
        <section id="dashboard" style="padding: 40px 20px; text-align: center;">
            <h2 style="font-size: 2.5rem; color: #4682b4;">Dashboard</h2>
            <div id="role-based-content">
                <!-- Content will be loaded based on role -->
            </div>
        </section>
    </main>

    <footer style="background-color: #4682b4; color: white; text-align: center; padding: 1rem; position: relative; bottom: 0; width: 100%;">
        <p>&copy; 2024 Evergreen General Hospital. All rights reserved.</p>
        <p>
            <a href="#" style="color: white; text-decoration: none; margin: 0 10px;">Facebook</a> |
            <a href="#" style="color: white; text-decoration: none; margin: 0 10px;">Twitter</a> |
            <a href="#" style="color: white; text-decoration: none; margin: 0 10px;">Instagram</a>
        </p>
    </footer>

    <script>
        function getRole() {
            // In a real application, this would be determined by a server-side session.
            // For this simulation, we'll use a simple prompt.
            let role = prompt("Enter your role (patient, doctor, admin):");
            return role;
        }

        function loadDashboard() {
            const role = getRole();
            const content = document.getElementById('role-based-content');
            if (role === 'patient') {
                content.innerHTML = '<h3>Welcome, Patient!</h3><p>Here you can view your upcoming appointments and medical records.</p>';
            } else if (role === 'doctor') {
                content.innerHTML = '<h3>Welcome, Doctor!</h3><p>Here you can manage your patient appointments and schedules.</p>';
            } else if (role === 'admin') {
                content.innerHTML = '<h3>Welcome, Admin!</h3><p>Here you can manage hospital staff, departments, and patient records.</p>';
            } else {
                content.innerHTML = '<h3>Invalid Role</h3><p>Please log in with a valid role to access the dashboard.</p>';
            }
        }

        function logout() {
            alert("You have been logged out.");
            window.location.href = "index.html";
        }

        window.onload = loadDashboard;
    </script>

</body>
</html>
